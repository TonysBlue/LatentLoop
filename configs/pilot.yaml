# Formal Pilot training after audit, Mimi encoding and validate-data.
model:
  model_dim: 512
  latent_dim: 512
  num_layers: 8
  num_heads: 8
  ffn_dim: 2048
  cross_attention_every: 2
  audio_tokens: 4
  audio_kernel: 400
  audio_stride: 160
  latent_slots: 8
  kv_units: 750
  kv_window_ms: 60000
  speech_frames_per_unit: 1
  speech_codebooks: 8
  speech_codebook_size: 2048
  speech_depth_layers: 2
  speech_depth_heads: 4
  speech_depth_ffn_dim: 1024
  action_schema_id: structured-action-v1
  action_coordinate_grid_size: 32
  action_type_bytes_per_unit: 16
  action_hotkey_keys_per_unit: 8
  dropout: 0.1
  activation_checkpointing: false
data:
  dataset: pilot
  source: webdataset
  shards: ~/latentloop-data/datasets/pilot/v1/shards/processed/train/train-*.tar
  manifest: ~/latentloop-data/datasets/pilot/v1/shards/processed/train/train-manifest.jsonl
  schema_version: 6
  audio_sample_rate: 24000
  codec_frame_rate: 12.5
  codec_id: mimi-24khz-8x2048
  codec_weight_hash: 09b782f0629851a271227fb9d36db65c041790365f11bbe5d3d59369cf863f50
  codec_revision: a49141e28b3d9c947cf9aa5314431e1b11cbd2f5
  codec_codebooks: 8
  codec_codebook_size: 2048
  unit_ms: 80
  unit_audio_samples: 1920
  screen_height: 224
  screen_width: 224
  episode_units: 750
  train_episodes: 10000
  seed: 17
training:
  stage: pretrain
  objective: supervised
  max_updates: 50000
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  tbptt_units: 750
  mixed_precision: fp16
  max_grad_norm: 1.0
  checkpoint_every: 500
  log_every: 10
  head_learning_rate: 0.0001
  backbone_learning_rate: 0.00003
  warmup_ratio: 0.03
  codec_scheduled_sampling: 0.25
  codec_scheduled_sampling_start: 0.7
  backbone_train_mode: all
  speech_loss_weight: 1.0
  action_loss_weight: 1.0
  memory_horizon_units: 750
  min_learning_rate_ratio: 0.1
  rl:
    group_size: 8
    clip_epsilon: 0.2
    reference_kl_beta: 0.02
    rollout_horizon_units: 750
    groups_per_update: 1
    environment_workers: 4
    environment_socket: ~/latentloop-data/runtime/pilot/harness-control.sock
    codec_socket: ~/latentloop-data/runtime/sockets/mimi.sock
    environment_id: isolated-desktop-v1
    environment_version: "1"
    environment_protocol_version: realtime-v1
    task_manifest: ~/latentloop-data/datasets/pilot/v1/rl/tasks.jsonl
    reward_spec_id: realtime-v1
    sampling_temperature: 0.8
    sampling_top_k: 250
tracking:
  enabled: true
  project: latentloop
  mode: online
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  data_root: ~/latentloop-data/datasets
  experiment_root: ~/latentloop-data/experiments/pilot/standalone
