model:
  model_dim: 64
  latent_dim: 64
  num_layers: 2
  num_heads: 4
  ffn_dim: 192
  cross_attention_every: 1
  audio_tokens: 2
  audio_kernel: 32
  audio_stride: 16
  latent_slots: 4
  kv_units: 4
  kv_window_ms: 320
  speech_frames_per_unit: 1
  speech_codebooks: 2
  speech_codebook_size: 32
  speech_depth_layers: 1
  speech_depth_heads: 4
  speech_depth_ffn_dim: 128
  max_action_duration_ms: 10000
  dropout: 0.0
  activation_checkpointing: false
data:
  dataset: synthetic
  source: synthetic
  schema_version: 4
  audio_sample_rate: 4000
  codec_frame_rate: 12.5
  codec_id: synthetic-codec-v1
  codec_weight_hash: synthetic
  codec_revision: synthetic
  codec_codebooks: 2
  codec_codebook_size: 32
  unit_ms: 80
  unit_audio_samples: 320
  screen_height: 32
  screen_width: 32
  episode_units: 8
  train_episodes: 4
  seed: 17
training:
  max_updates: 4
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  tbptt_units: 8
  mixed_precision: "no"
  max_grad_norm: 1.0
  checkpoint_every: 2
  log_every: 1
  head_learning_rate: 0.001
  backbone_learning_rate: 0.001
  warmup_ratio: 0.0
  codec_scheduled_sampling: 0.0
  codec_scheduled_sampling_start: 0.7
  backbone_train_mode: all
  speech_loss_weight: 1.0
  action_loss_weight: 1.0
  memory_horizon_units: 8
tracking:
  enabled: false
  project: latentloop
  mode: disabled
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  data_root: ~/latentloop-data/datasets
  experiment_root: ~/latentloop-data/experiments/smoke/default
