environment_id: isolated-qemu-v1
environment_version: "1"
protocol_version: realtime-v1
action_schema_id: structured-action-v1
base_image: ~/latentloop-data/assets/images/canary-base.qcow2
runtime_root: ~/latentloop-data/runtime/canary/qemu
model_service_socket: ~/latentloop-data/runtime/canary/model-service.sock
control_socket: ~/latentloop-data/runtime/canary/harness-control.sock
screen_width: 224
screen_height: 224
# Commands are JSON argv arrays for the host SPICE bridge and external task evaluator.
spice_screen_command: '["latentloop-spice-bridge", "--display", "${SPICE_DISPLAY}"]'
spice_audio_capture_command: '["latentloop-audio-bridge", "--capture", "${SPICE_AUDIO_SOCKET}"]'
spice_audio_playback_command: '["latentloop-audio-bridge", "--playback", "${SPICE_AUDIO_SOCKET}"]'
evaluator_command: '["latentloop-task-evaluator", "--manifest", "~/latentloop-data/datasets/canary/v1/rl/tasks.jsonl"]'
