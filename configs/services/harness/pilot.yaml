environment_id: isolated-qemu-v1
environment_version: "1"
protocol_version: realtime-v2
action_schema_id: structured-action-v1
base_image: ~/latentloop-data/assets/images/pilot-base.qcow2
runtime_root: ~/latentloop-data/runtime/pilot/qemu
model_service_socket: ~/latentloop-data/runtime/pilot/model-service.sock
control_socket: ~/latentloop-data/runtime/pilot/harness-control.sock
screen_width: 224
screen_height: 224
spice_screen_command: '["latentloop-spice-bridge", "--display", "${SPICE_DISPLAY}"]'
spice_audio_capture_command: '["latentloop-audio-bridge", "--capture", "${SPICE_AUDIO_SOCKET}"]'
spice_audio_playback_command: '["latentloop-audio-bridge", "--playback", "${SPICE_AUDIO_SOCKET}"]'
evaluator_command: '["latentloop-task-evaluator", "--manifest", "~/latentloop-data/datasets/pilot/rl/tasks.jsonl"]'
