model:
  model_dim: 896
  latent_dim: 1024
  num_layers: 18
  num_heads: 14
  ffn_dim: 3584
  cross_attention_every: 4
  audio_tokens: 4
  audio_kernel: 400
  audio_stride: 160
  latent_slots: 16
  kv_units: 32
  speech_frames_per_unit: 38
  speech_codebooks: 4
  speech_codebook_size: 1024
  action_text_tokens: 16
  action_text_vocab_size: 256
  action_key_vocab_size: 32
  max_action_duration_ms: 10000
  memory_classes: 128
  dropout: 0.1
  activation_checkpointing: true
data:
  source: webdataset
  shards: ~/latentloop-data/processed/train-{000000..000999}.tar
  manifest: ~/latentloop-data/processed/train-manifest.jsonl
  schema_version: 1
  audio_sample_rate: 24000
  codec_frame_rate: 75
  codec_id: neural-codec-24khz-v1
  codec_weight_hash: replace-before-real-training
  unit_ms: 500
  unit_audio_samples: 12000
  screen_height: 224
  screen_width: 224
  episode_units: 32
  train_episodes: 100000
  seed: 17
training:
  max_updates: 100000
  learning_rate: 0.0002
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  tbptt_units: 4
  mixed_precision: fp16
  max_grad_norm: 1.0
  checkpoint_every: 1000
  log_every: 10
tracking:
  enabled: true
  project: latentloop
  mode: online
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  data_root: ~/latentloop-data
