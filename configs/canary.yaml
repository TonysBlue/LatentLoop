# One-hour Canary: an end-to-end pipeline run after production data audit and
# Mimi encoding. The default is full training so a missing base checkpoint cannot
# silently leave a randomly initialized frozen backbone.  For a quality-valid
# warm start, pass --init-from with a compatible base checkpoint.
model:
  model_dim: 512
  latent_dim: 512
  num_layers: 8
  num_heads: 8
  ffn_dim: 2048
  cross_attention_every: 2
  audio_tokens: 4
  audio_kernel: 400
  audio_stride: 160
  latent_slots: 8
  kv_units: 200
  kv_window_ms: 16000
  speech_frames_per_unit: 1
  speech_codebooks: 8
  speech_codebook_size: 2048
  speech_depth_layers: 2
  speech_depth_heads: 4
  speech_depth_ffn_dim: 1024
  action_text_tokens: 16
  action_text_vocab_size: 256
  action_key_vocab_size: 32
  max_action_duration_ms: 10000
  memory_classes: 64
  dropout: 0.1
  activation_checkpointing: false
data:
  source: webdataset
  shards: ~/latentloop-data/pilot-data/processed/canary/train/train-*.tar
  manifest: ~/latentloop-data/pilot-data/processed/canary/train/train-manifest.jsonl
  schema_version: 2
  audio_sample_rate: 24000
  codec_frame_rate: 12.5
  codec_id: mimi-24khz-8x2048
  codec_weight_hash: 09b782f0629851a271227fb9d36db65c041790365f11bbe5d3d59369cf863f50
  codec_revision: a49141e28b3d9c947cf9aa5314431e1b11cbd2f5
  codec_codebooks: 8
  codec_codebook_size: 2048
  unit_ms: 80
  unit_audio_samples: 1920
  screen_height: 224
  screen_width: 224
  episode_units: 32
  train_episodes: 1000
  seed: 17
training:
  max_updates: 2000
  learning_rate: 0.0003
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  tbptt_units: 16
  mixed_precision: fp16
  max_grad_norm: 1.0
  checkpoint_every: 250
  log_every: 10
  head_learning_rate: 0.0001
  backbone_learning_rate: 0.00003
  warmup_ratio: 0.03
  codec_scheduled_sampling: 0.1
  codec_scheduled_sampling_start: 0.7
  backbone_train_mode: all
  speech_control_class_weights: [1.0, 4.0, 1.0, 1.0, 4.0]
  speech_control_loss_weight: 0.5
tracking:
  enabled: true
  project: latentloop
  mode: online
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  data_root: ~/latentloop-data/canary-run
