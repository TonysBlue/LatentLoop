[project]
name = "latentloop-cosyvoice-adapter"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "gdown==5.1.0",
  "grpcio==1.57.0",
  "grpcio-tools==1.57.0",
  "hydra-core==1.3.2",
  "hyperpyyaml==1.2.3",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "lightning==2.2.4",
  "matplotlib==3.7.5",
  "networkx==3.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnx==1.16.0",
  "onnxruntime-gpu==1.18.0",
  "openai-whisper==20231117",
  "protobuf==4.25.8",
  "pyarrow==18.1.0",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "setuptools<81",
  "soundfile==0.12.1",
  "torch==2.3.1+cu121",
  "torchaudio==2.3.1+cu121",
  "transformers==4.51.3",
  "wetext==0.0.4",
  "wget==3.2",
  "x-transformers==2.11.24",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]
