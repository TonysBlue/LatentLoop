[project]
name = "training"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.14.0",
  "hydra-core==1.3.4",
  "numpy>=1.26,<3",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "wandb==0.28.1",
  "latentloop-contracts",
  "latentloop-data",
  "latentloop-runtime",
  "harness",
  "latentloop-media",
]

[project.scripts]
training = "training.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
