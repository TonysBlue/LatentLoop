[project]
name = "training"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["latentloop", "latentloop-contracts", "latentloop-data", "latentloop-runtime"]

[project.scripts]
training = "training.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
