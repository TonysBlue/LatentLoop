[project]
name = "model-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "latentloop-contracts",
  "latentloop-media",
  "latentloop-model",
  "latentloop-runtime",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "torch==2.13.0",
]

[project.scripts]
model-service = "model_service.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]
