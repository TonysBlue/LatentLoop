[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["latentloop-contracts", "numpy>=1.26,<3"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
