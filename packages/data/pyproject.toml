[project]
name = "latentloop-data"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["latentloop", "numpy>=1.26,<3", "webdataset==1.0.2"]

[project.scripts]
data = "data.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]
